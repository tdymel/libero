[package]
name = "docs"
version = "0.1.0"
edition = "2024"

[dependencies]
# TEMPORARY: see the matching comment in libero/Cargo.toml - local path dep
# against the `.dioxus-active` symlink instead of crates.io, unwind before any
# real release.
dioxus = { path = "../.dioxus-active/packages/dioxus", default-features = true, features = ["router"] }
# Only what these pages actually highlight.
libero = { path = "../libero", default-features = false, features = [
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-css",
    "code-lang-toml",
] }
# `dioxus/native` would pull this in with its default features, and its
# default renderer (`vello-hybrid`) can't be switched off from here - so
# `native-cpu` depends on it directly, with the default set minus the
# renderer. See that feature.
dioxus-native = { path = "../.dioxus-active/packages/native", optional = true, default-features = false, features = [
    "accessibility",
    "hot-reload",
    "net",
    "html",
    "svg",
    "system-fonts",
    "clipboard",
    "file-dialog",
    "woff",
] }


[features]
# Render with Blitz (dioxus-native) in a winit window instead of the browser.
# Selected by `just start-native`; `dx` needs the matching `--renderer native`.
native = ["dioxus/native", "libero/native"]
# Full Vello (compute-based) instead of the default `vello-hybrid`. Hybrid
# keeps every decoded image in one fixed-size GPU atlas and never evicts, so
# browsing enough docs pages panics it with `AtlasLimitReached`
# (vello_hybrid-0.1.0 render/wgpu.rs:544, an `.unwrap()` on the allocation).
# Full Vello has no such atlas. It layers onto `native` rather than replacing
# it - `dioxus-native` prefers `vello` over `vello-hybrid`, and unlike
# `vello-cpu-base` the two still compile together.
native-vello = ["native", "dep:dioxus-native", "dioxus-native/vello"]
# Same window, rasterised on the CPU (softbuffer) instead of through wgpu -
# for machines with no usable Vulkan adapter, where `native` panics inside
# `anyrender_vello_hybrid` before the first frame.
#
# Deliberately NOT built on `native`: with both renderers enabled at once
# dioxus-native doesn't compile (`with_features_and_limits` is gated on
# `vello-hybrid` but takes its types from whichever renderer the cfg_if picks,
# and `vello-cpu-base` outranks it). So this skips `dioxus/native` and `main`
# calls `dioxus_native::launch` instead of `dioxus::launch`.
native-cpu = ["dep:dioxus-native", "dioxus-native/vello-cpu-softbuffer", "libero/native"]
# SSR + hydration: `dx` builds the client with `dioxus/web` and a second
# server binary with `dioxus/server`, and serves both. Selected by
# `just start-fullstack`.
fullstack = ["dioxus/fullstack"]
# WebView (wry) on Android, via `dx --platform android`. Unlike `native`
# there's no renderer choice to make: the app runs in the system WebView, so
# the same CSS engine styles it as on the web. `dioxus/mobile` is
# `dioxus-desktop` with a mobile event loop, so no separate `launch` call.
mobile = ["dioxus/mobile"]
# Build against `.dioxus-fork`; must match whichever tree `.dioxus-active`
# points at. Set by `just mode-fork`.
dioxus-fork = ["libero/dioxus-fork"]
# Every route in its own lazily fetched chunk (297 KB brotli of main bundle
# instead of 414 KB, measured 2026-09-02). Off by default: the split wasm
# imports `__wasm_split.js`, which only `dx --wasm-split` emits, so a build
# without both fails to load - see `justfile`'s release recipes. The
# wasm-split-cli fixes it relies on are fork-only, so this implies fork mode.
wasm-split = ["dioxus/wasm-split", "dioxus-fork"]

[lints]
workspace = true
