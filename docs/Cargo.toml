[package]
name = "docs"
version = "0.1.0"
edition = "2024"

[dependencies]
# TEMPORARY: see the matching comment in libero/Cargo.toml - local path dep
# against .dioxus-fork instead of crates.io, unwind before any real release.
dioxus = { path = "../.dioxus-fork/packages/dioxus", default-features = true, features = ["router"] }
libero = { path = "../libero", default-features = false, features = [
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
] }

[features]
# Every route in its own lazily fetched chunk (297 KB brotli of main bundle
# instead of 414 KB, measured 2026-09-02). Off by default: the split wasm
# imports `__wasm_split.js`, which only `dx --wasm-split` emits, so a build
# without both fails to load - see `justfile`'s release recipes.
wasm-split = ["dioxus/wasm-split"]
