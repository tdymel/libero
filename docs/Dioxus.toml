# `public/` is copied verbatim (unhashed) into the dist root. The table has to
# be here: with no `[application]` at all, `dx` falls back to the derived
# `Default`, where `public_dir` is `None` and nothing is copied.
[application]
public_dir = "public"

[web]
# Emits brotli siblings (`.br`, no gzip) for the wasm and assets in release
# builds: the main wasm is 7.19 MB raw against 1.69 MB brotli (2026-09-28).
# One bundle: `dx --wasm-split` builds without fat LTO (938), but the app has no
# split points yet, so it emits a single 294-byte chunk.
# The host must be configured to serve them - `serve_dist.py` is the local
# equivalent.
pre_compress = true

[web.app]
# dx concatenates its title into an existing <title>, so setting it here is
# what stops index.html rendering as "liberodioxus | ⛺".
title = "libero"

[android]
# `dx` otherwise makes one up (`com.example.docs`), and it ends up baked into
# the generated gradle project, the APK and the emulator's package list.
identifier = "dev.libero.docs"
