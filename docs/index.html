<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <!-- dx appends `[web.app] title` from `Dioxus.toml` here. -->
        <title></title>
        <meta name="description" content="Libero, a Dioxus component library for Rust: typed style props, a theme of design tokens, and accessible components for the web, Blitz, desktop and Android.">
        <link rel="icon" type="image/png" sizes="192x192" href="/{base_path}/favicon.png">
        <!-- Site-wide: this shell also answers every deep link, so no canonical or
             og:url here. The absolute URLs are pinned by `src/index_html.rs`. -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Libero">
        <meta property="og:title" content="Libero">
        <meta property="og:description" content="Libero, a Dioxus component library for Rust: typed style props, a theme of design tokens, and accessible components for the web, Blitz, desktop and Android.">
        <meta property="og:image" content="https://libero-ui.dev/og-image.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="The Libero logo, a dog drawn in vertical bars">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Libero">
        <meta name="twitter:description" content="Libero, a Dioxus component library for Rust: typed style props, a theme of design tokens, and accessible components for the web, Blitz, desktop and Android.">
        <meta name="twitter:image" content="https://libero-ui.dev/og-image.png">
        <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"Libero","url":"https://libero-ui.dev","inLanguage":"en"},{"@type":"SoftwareSourceCode","name":"Libero","description":"A Dioxus component library: typed style props, a theme of design tokens, and accessible components.","programmingLanguage":"Rust","codeRepository":"https://github.com/tdymel/libero","url":"https://libero-ui.dev"}]}</script>
        <!-- dx preloads the entry JS but not the wasm it fetches, so the wasm
             request only starts once that module has downloaded and parsed.
             `preload_wasm.sh` (run by `just build`/`just build_release`) rewrites
             this marker with the real hashed filename, collapsing the round
             trip. `dx serve` does not run it - build and serve the output to
             measure the difference. -->
        <!-- LIBERO_WASM_PRELOAD -->
        <!-- `libero::theme::COLOR_SCHEME_RESTORE_SCRIPT`, verbatim, pinned by
             `src/index_html.rs`. In the
             head so it runs before the first paint: the wasm bundle has not
             booted then, so the Rust-side restore is one flash of the wrong
             scheme too late. Under a strict CSP this needs
             sha256-i2dSUtjYkvH3Km+1WnMbJX1ZfgYnbdyuKeoc3clqFQ0= -->
        <script>try{var s=localStorage.getItem('lsx-color-scheme');if(s==='light'||s==='dark')document.documentElement.setAttribute('data-lsx-theme',s)}catch(e){}</script>
    </head>
    <body>
        <div id="main"></div>
        <!-- The site is a wasm app; without it, the same pages as markdown. -->
        <noscript>
            <p>These docs need JavaScript and WebAssembly. Every page is also plain
               markdown: start at the <a href="/{base_path}/md/index.md">markdown index</a>.</p>
        </noscript>
    </body>
</html>
