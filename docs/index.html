        <meta name="viewport" content="width=device-width, initial-scale=1">

             request only starts once that module has downloaded and parsed.

             this marker with the real hashed filename, collapsing the round
             trip. `dx serve` does not run it - build and serve the output to
             measure the difference. -->
        <!-- LIBERO_WASM_PRELOAD -->
