# `public/sw.js` is `use_push_subscription`'s worker, served at the root.
[application]
public_dir = "public"

[web.app]
# `dx` concatenates its title into an existing <title>; naming it here keeps
# the fixture pages from rendering as "e2e-fixturesdioxus | ⛺".
title = "libero e2e fixtures"

[android]
# The package the e2e runner installs, launches and forwards CDP to (964).
identifier = "dev.libero.fixtures"

# `use_geolocation`'s and `use_user_media`'s fixtures; the runner grants them before launch.
[permissions]
location = { precision = "fine", description = "The geolocation fixture" }
camera = { description = "The user media fixture" }
microphone = { description = "The user media fixture" }

# wry's WebView asks it with RECORD_AUDIO; undeclared, every microphone request is denied (1346).
[android.permissions]
"android.permission.MODIFY_AUDIO_SETTINGS" = { description = "The user media fixture" }
