[package]
name = "e2e-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Same git dioxus as `libero` and `docs`, so the fixture app is built from the
# identical dioxus the library is.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", default-features = true, features = ["router"] }
libero = { path = "../../libero" }

[features]
# The Android fixtures APK (964): `dx build --platform android --features mobile`.
mobile = ["dioxus/mobile"]

# `perf::install`: counts dioxus-core's `render` spans per scope on `/perf/*`
# pages. The versions dioxus-logger already pulls in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location"] }
