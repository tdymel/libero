# One platform x tier job with one test filter (3315), to debug a CI red in minutes instead of
# the full matrix. A `ci/*` push reads `.github/ci-probe` (written by team-common `ted_ci.py`);
# a dispatch takes the same three inputs. The step bodies are platforms.yml's and ci.yml's.
name: CI probe

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [linux, macos, windows]
        default: linux
      tier:
        type: choice
        options: [unit, native, web, desktop, ios]
        default: unit
      filter:
        description: A test path like `tabs::`, a prefix when it ends in `::`.
        type: string
        required: true
      env:
        description: Space-separated NAME=value pairs for the test run.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: CI prints no backtraces, and a Windows probe built 16% faster (3407).
  # The same in every workflow, since the cargo cache key hashes it.
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      os: ${{ steps.plan.outputs.os }}
      tier: ${{ steps.plan.outputs.tier }}
      filter: ${{ steps.plan.outputs.filter }}
      env: ${{ steps.plan.outputs.env }}
      runner: ${{ steps.plan.outputs.runner }}
      cache: ${{ steps.plan.outputs.cache }}
      dev: ${{ steps.plan.outputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: plan
        run: python3 .github/scripts/ci_probe.py plan
        env:
          PROBE_OS: ${{ inputs.os }}
          PROBE_TIER: ${{ inputs.tier }}
          PROBE_FILTER: ${{ inputs.filter }}
          PROBE_ENV: ${{ inputs.env }}

  # `tier=none`: joins the dev's group below, which cancels their running probe.
  cancel:
    needs: plan
    if: needs.plan.outputs.tier == 'none'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-probe-${{ github.ref }}-${{ needs.plan.outputs.dev }}
      cancel-in-progress: true
    steps:
      - run: echo "cancelled the running probe of ${{ needs.plan.outputs.dev }}"

  probe:
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    name: ${{ needs.plan.outputs.os }} ${{ needs.plan.outputs.tier }} ${{ needs.plan.outputs.filter }}
    runs-on: ${{ needs.plan.outputs.runner }}
    # An iOS shard of skipped scenarios took 66-92 min and once hit 90 (3458); a macOS web shard runs ~50 min after a ~10 min build (3444).
    timeout-minutes: ${{ needs.plan.outputs.tier == 'ios' && (contains(needs.plan.outputs.env, 'E2E_IOS_IGNORED') && 150 || 90) || (needs.plan.outputs.os == 'macos' && 90 || 60) }}
    # The shared `ci/probe-<os>-<tier>` branches (3407): a dev's newer push cancels only their own probe.
    concurrency:
      group: ci-probe-${{ github.ref }}-${{ needs.plan.outputs.dev }}
      cancel-in-progress: true
    env:
      OS: ${{ needs.plan.outputs.os }}
      TIER: ${{ needs.plan.outputs.tier }}
      FILTER: ${{ needs.plan.outputs.filter }}
      PROBE_ENV: ${{ needs.plan.outputs.env }}
      PY: ${{ needs.plan.outputs.os == 'windows' && 'python' || 'python3' }}
    steps:
      # Before the checkout: LF files as on Linux (`include_str!`, snapshots), no MAX_PATH limit.
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux' && env.TIER == 'native'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libdbus-1-dev fonts-dejavu-core xvfb
      - if: runner.os == 'Linux' && env.TIER == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev fonts-dejavu-core xvfb xdotool
      - uses: ./.github/actions/setup
        with:
          targets: ${{ env.TIER == 'web' && 'wasm32-unknown-unknown' || env.TIER == 'ios' && 'aarch64-apple-ios-sim' || '' }}
          cache-key: ${{ needs.plan.outputs.cache }}
          # Main's cache of the leg, restored only (3413).
          save-cache: false
      - if: env.TIER == 'web' || env.TIER == 'ios'
        uses: ./.github/actions/dx
      # The same pin as ci.yml's `e2e` job: the AX snapshots follow Chrome's tree.
      - if: env.TIER == 'web' && runner.os != 'macOS'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 152.0.7977.82
      # As platforms.yml's `macos-web`: the headless shell (3636).
      - if: env.TIER == 'web' && runner.os == 'macOS'
        id: shell
        run: bash .github/scripts/headless_shell.sh 152.0.7977.82
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - if: runner.os == 'Linux' && env.TIER == 'web'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image lists no WebView2 runtime; as platforms.yml's `windows-desktop`.
      - if: runner.os == 'Windows' && env.TIER == 'desktop'
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile "$env:RUNNER_TEMP\installwebview.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\installwebview.exe" -ArgumentList '/silent', '/install' -Wait
      # As platforms.yml's `ios-e2e`: AXe injects the touches, a hardware keyboard raises no soft one.
      - if: env.TIER == 'ios'
        run: |
          brew tap cameroncooke/axe
          git -C "$(brew --repository cameroncooke/axe)" checkout --detach 64a21aa4c30e173280a0c3847b19a9a57dfcbfc0
          brew install cameroncooke/axe/axe
          axe --version
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
      - name: Probe
        run: |
          logs="$RUNNER_TEMP/probe"
          mkdir -p "$logs"
          # `plan` validated the pairs: the unquoted expansion splits them, nothing else.
          if [ -n "$PROBE_ENV" ]; then export $PROBE_ENV; fi
          # `shard:N:M` is the Nth of M slices of the units, as the platform legs split them; `smoke` the macOS web leg's.
          filters="$FILTER"
          case "$FILTER" in
            shard:*) IFS=: read -r _ n m <<< "$FILTER"
              filters=$($PY .github/scripts/shard.py units "$n" "$m" | tr -d '\r') ;;
            smoke) filters=$($PY .github/scripts/shard.py smoke | tr -d '\r') ;;
          esac
          # The runner's artifacts go to `temp_dir()`: `$TMPDIR` on macOS, `%TMP%` on Windows.
          case "$RUNNER_OS" in
            macOS) export TMPDIR="$RUNNER_TEMP" ;;
            Windows) export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" ;;
          esac
          # Every 30 s on macOS (3444): load, the busiest processes with Chrome's process type, and
          # the newest ones with their parent, to see what spawns. No `top`: it hung under load.
          if [ "$RUNNER_OS" = macOS ]; then
            sysctl hw.ncpu kern.maxproc > "$logs/sampler.log"
            name='{ c = $0; sub(/^ *[^ ]+ +[^ ]+ +[^ ]+ +/, "", c); t = ""
              if (match(c, /--(type|utility-sub-type)=[^ ]+/)) t = substr(c, RSTART, RLENGTH)
              sub(/ --.*/, "", c); n = split(c, p, "/"); print $1, $2, $3, p[n], t }'
            # `+e`: `head` closing a pipe failed the loop under the step's `-e -o pipefail`.
            (set +e +o pipefail; while sleep 30; do date -u +%T; sysctl -n vm.loadavg; memory_pressure -Q | tail -1
              echo "procs $(ps -A | wc -l)"
              ps -A -o %cpu=,pid=,ppid=,command= | sort -rn | head -6 | awk "$name"
              echo newest; ps -A -o pid=,ppid=,etime=,command= | sort -rn | head -12 | awk "$name"
            done) >> "$logs/sampler.log" 2>&1 &
          fi
          case "$TIER" in
            unit)
              # As platforms.yml's unit legs: libero, then the e2e runner's own tests.
              red=0
              cargo test -p libero --lib --tests -- "$FILTER" 2>&1 | tee "$logs/unit.log" || red=1
              cargo test -p e2e --lib --bins -- "$FILTER" 2>&1 | tee -a "$logs/unit.log" || red=1
              exit "$red" ;;
            native)
              cargo test -p e2e --features native --test native --test all --no-run 2>&1 | tee "$logs/build.log"
              # The shell runs `-e -o pipefail`: keep going after a red binary, as platforms.yml.
              red=0
              # `::native` is the whole set, the native binary included, as platforms.yml.
              only=$FILTER; if [ "$FILTER" = ::native ]; then only=; fi
              cargo test -p e2e --features native --test native -- $only 2>&1 | tee "$logs/native.log" || red=1
              args=$(cargo test -q -p e2e --features native --test all -- ::native --list \
                | $PY .github/scripts/ci_probe.py names "$FILTER" | tr -d '\r')
              if [ -z "$args" ]; then
                echo "no ::native scenario matches $FILTER" | tee "$logs/all.log"
                exit "$red"
              fi
              xvfb=()
              if [ "$RUNNER_OS" = Linux ]; then xvfb=(xvfb-run -a -s "-screen 0 1280x800x24"); fi
              # shellcheck disable=SC2086
              "${xvfb[@]}" cargo test -p e2e --features native --test all -- $args 2>&1 | tee "$logs/all.log" || red=1
              exit "$red" ;;
            web)
              # shellcheck disable=SC2086
              cargo run -p e2e -- $filters 2>&1 | tee "$logs/e2e.log" ;;
            desktop)
              # The tests' feature: their build reuses the runner's target dir, Windows too (3407).
              # shellcheck disable=SC2086
              cargo run -p e2e --features desktop -- desktop $filters 2>&1 | tee "$logs/e2e.log" ;;
            ios)
              # shellcheck disable=SC2086
              cargo run -p e2e -- ios $filters 2>&1 | tee "$logs/e2e.log" ;;
          esac
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path || steps.shell.outputs.chrome-path }}
          E2E_DESKTOP_DEADLINE: 1500
      - if: failure() || cancelled()
        run: $PY .github/scripts/ci_annotate.py "$RUNNER_TEMP"/probe/{build,unit,native,all,e2e}.log
      - if: always()
        run: $PY .github/scripts/ci_probe.py summary "$RUNNER_TEMP"/probe/{unit,native,all,e2e}.log
      # The platform probe's facts and the drivers' calibration, as notices.
      - if: always() && (env.TIER == 'desktop' || env.TIER == 'ios')
        run: |
          for dir in /tmp/e2e-artifacts "$RUNNER_TEMP/e2e-artifacts"; do
            if [ -d "$dir" ]; then $PY .github/scripts/probe_notice.py "$dir"; fi
          done
      # One upload root: paths on two drives fail the upload on Windows.
      - if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          for dir in /tmp/e2e-artifacts "$RUNNER_TEMP/e2e-artifacts"; do
            if [ -d "$dir" ]; then cp -r "$dir" "$RUNNER_TEMP/probe/"; fi
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ needs.plan.outputs.os }}-${{ needs.plan.outputs.tier }}
          path: ${{ runner.temp }}/probe
          if-no-files-found: ignore
          retention-days: 3
