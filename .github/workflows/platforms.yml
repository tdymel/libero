# Builds the docs app once per platform (1219), dev profile, and runs the e2e suites on macOS
# (2776), Windows (2781, 2783), an iOS simulator (2784) and the Linux desktop WebView (2874).
# Informational: not part of the required `ci` check.
# Cargo caches: only the windows-native, -web, -desktop, macos-desktop and ios-e2e legs save (cold 13-39 min,
# warm 4-6), so ci.yml's keys stay within 10 GB; the others restore the nearest saved build of their OS (3413).
name: Platforms

# On by default since the repo is public (standard runners are free there, macOS and Windows too).
# On main once CI has passed on the pushed commit, so CI's jobs never queue behind these (3439).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: CI prints no backtraces, and a Windows probe built 16% faster (3407).
  # The same in every workflow, since the cargo cache key hashes it.
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  web:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: e2e
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: |
          dx build --platform web --debug-symbols=false
          ./preload_wasm.sh ../target/dx/docs/debug/web/public
      - uses: actions/upload-artifact@v7
        with:
          name: docs-web
          path: target/dx/docs/debug/web/public
          retention-days: 3

  # Blitz. `--platform linux` because two features map to a renderer, see docs/native.just.
  native:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libdbus-1-dev
      - uses: ./.github/actions/setup
        with:
          cache-key: native
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform linux --renderer native --debug-symbols=false --features native-vello

  # Whether Blitz and libero/native compile off Linux at all; a `dx build` once they do.
  native-check:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ runner.os == 'Windows' && 'platforms-windows-native' || 'platforms-macos-desktop' }}
          save-cache: false
      - run: cargo check -p docs --features native-vello

  # ci.yml's `test` and libero's clippy on a Mac and Windows cfg, which nothing else runs; plus
  # the iOS cfg arms on the Mac. Expect first-run reds in the tests that read sources.
  unit:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            targets: aarch64-apple-ios-sim
            python: python3
          - os: windows-2025
            targets: ""
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Before the checkout: LF files as on Linux (`include_str!`, snapshots), no MAX_PATH limit.
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.targets }}
          components: clippy
          cache-key: ${{ runner.os == 'Windows' && 'platforms-windows-native' || 'platforms-macos-desktop' }}
          save-cache: false
      # Every step runs whatever the last one did, so one run names every red.
      - run: cargo test -p libero --lib --tests 2>&1 | tee "$RUNNER_TEMP/libero.log"
      - if: success() || failure()
        run: cargo test -p e2e --lib --bins 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - if: success() || failure()
        run: cargo test -p docs 2>&1 | tee "$RUNNER_TEMP/docs.log"
      - if: success() || failure()
        run: cargo clippy -p libero --all-targets --features desktop -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      # The Apple and iOS arms (`storage.rs`, `backend/mod.rs`) only an iOS build compiles.
      - if: runner.os == 'macOS' && (success() || failure())
        run: cargo clippy -p libero --target aarch64-apple-ios-sim -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy-ios.log"
      - if: failure() || cancelled()
        run: ${{ matrix.python }} .github/scripts/ci_annotate.py "$RUNNER_TEMP"/*.log

  # wry on the system WebView: WebKitGTK, WebView2, WKWebView.
  desktop:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ runner.os == 'Linux' && 'e2e' || runner.os == 'Windows' && 'platforms-windows-desktop' || 'platforms-macos-desktop' }}
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform desktop --renderer webview --debug-symbols=false --features desktop

  # The e2e suites on macOS (2776), informational like every leg here. Blitz first: the harness
  # is windowless with a CPU rasteriser, so it needs no display or GPU.
  macos-native:
    if: false
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # What the hosted VM offers: the GUI session (`Aqua`) and its Metal device, if any.
      - run: |
          sw_vers
          launchctl managername
          system_profiler SPDisplaysDataType
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-macos-desktop
          save-cache: false
      # Both test binaries in one cargo run, as ci.yml's `native` job; no xvfb on macOS.
      # Each red-able step tees its log for `ci_annotate.py`: job logs need auth, annotations not.
      - run: cargo test -p e2e --features native --test native --test all --no-run 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: cargo test -p e2e --features native --test native 2>&1 | tee "$RUNNER_TEMP/native.log"
      - if: success() || failure()
        run: cargo test -p e2e --features native --test all -- ::native 2>&1 | tee "$RUNNER_TEMP/all.log"
      - if: failure() || cancelled()
        run: python3 .github/scripts/ci_annotate.py "$RUNNER_TEMP"/{build,native,all}.log

  # A smoke of the browser tier on macOS: the units where a Mac differs (Cmd as `mod`, editing, IME).
  # The whole tier wedges headless Chrome on the 3-core runner after 170-350 tests (3444).
  macos-web:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: platforms-ios-e2e
          save-cache: false
      - uses: ./.github/actions/dx
      # The same pin as ci.yml's `e2e` job: the AX snapshots follow Chrome's tree.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 152.0.7977.82
      - run: '"${{ steps.chrome.outputs.chrome-path }}" --version'
      - run: |
          bash .github/scripts/stall_sample.sh "$RUNNER_TEMP/e2e-artifacts" &
          units=$(python3 .github/scripts/shard.py smoke)
          echo "units: $units"
          # shellcheck disable=SC2086
          cargo run -p e2e -- $units 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # The runner's artifacts go to `temp_dir()`, which is `$TMPDIR` on macOS.
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        run: python3 .github/scripts/ci_annotate.py "$RUNNER_TEMP/e2e.log"
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: macos-e2e-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # The desktop arm on WKWebView (2782): the fixture app sends its own WebView NSEvents, so
  # no Xvfb, no xdotool, no TCC grant.
  macos-desktop:
    if: false
    runs-on: macos-26
    # A cold build is ~16 min, the scenarios ~13 min (2862).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-macos-desktop
      # What the session gives a window; unknown until a run (plans/ios-mac-ci/macos-desktop.md).
      - name: Probe the GUI session
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          sw_vers
          echo "launchd session: $(launchctl managername)"
          system_profiler SPDisplaysDataType
          screencapture -x "$RUNNER_TEMP/e2e-artifacts/session.png" && sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/e2e-artifacts/session.png"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" 'select service, client, auth_value from access' || true
      # The runner prints `e2e desktop: macOS window {..}` per launch: key, active, occlusion, scale.
      - run: cargo run -p e2e --features desktop -- desktop 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          # The runner's artifacts go to `temp_dir()`, which is `$TMPDIR` on macOS.
          TMPDIR: ${{ runner.temp }}
          # Inside the job's 60 min, after a ~16 min cold build: a hang still uploads.
          E2E_DESKTOP_DEADLINE: 1800
      - if: failure() || cancelled()
        run: python3 .github/scripts/ci_annotate.py "$RUNNER_TEMP/e2e.log"
      - if: failure()
        run: screencapture -x "$RUNNER_TEMP/e2e-artifacts/failure.png"
      # The platform probe's facts and the unpinned arms' outcomes, as notices.
      - if: always()
        run: python3 .github/scripts/probe_notice.py "$RUNNER_TEMP/e2e-artifacts"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-desktop-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 3

  # On demand only: a WKWebView window answering the e2e bridge, and windowed Blitz on wgpu.
  # `macos-desktop` runs the desktop arm itself (2782).
  macos-probe:
    if: false
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-macos-probe
          save-cache: false
      - run: cargo build -p e2e-fixtures --features desktop
      - continue-on-error: true
        run: python3 .github/scripts/window_probe.py desktop target/debug/e2e-fixtures probe
      - run: cargo build -p docs --features native-vello
      - continue-on-error: true
        run: python3 .github/scripts/window_probe.py native target/debug/docs probe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-probe
          path: probe
          if-no-files-found: ignore
          retention-days: 3

  # The e2e suites on Windows (2781), informational. The runner ends process trees with
  # `taskkill` there; `shell: bash` is Git for Windows' bash.
  windows-native:
    if: false
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Before the checkout: LF files as on Linux (`include_str!`, snapshots), no MAX_PATH limit.
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-windows-native
      # Both test binaries in one cargo run, as ci.yml's `native` job; no xvfb on Windows.
      - run: cargo test -p e2e --features native --test native --test all --no-run 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: cargo test -p e2e --features native --test native 2>&1 | tee "$RUNNER_TEMP/native.log"
      - if: success() || failure()
        run: cargo test -p e2e --features native --test all -- ::native 2>&1 | tee "$RUNNER_TEMP/all.log"
      - if: failure() || cancelled()
        run: python .github/scripts/ci_annotate.py "$RUNNER_TEMP"/{build,native,all}.log

  # The browser tier on Windows: the e2e runner, dx and pinned Chrome, as ci.yml's `e2e` job.
  windows-web:
    if: false
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SHARDS: 2
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: platforms-windows-web
      - uses: ./.github/actions/dx
      # The same pin as ci.yml's `e2e` job: the AX snapshots follow Chrome's tree.
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 152.0.7977.82
      # `chrome.exe --version` prints nothing on Windows; the file version says it.
      - run: powershell -NoProfile -Command "(Get-Item '${{ steps.chrome.outputs.chrome-path }}').VersionInfo.ProductVersion"
      # This step went red in 43 s before cargo ran: which python, and what `shard.py` says.
      - run: |
          {
            command -v python python3 || true
            python --version
            python .github/scripts/shard.py units ${{ matrix.shard }} "$SHARDS"
          } 2>&1 | tee "$RUNNER_TEMP/shard.log"
      - run: |
          # Python writes CRLF on Windows; a `\r` would end up in the last filter.
          units=$(python .github/scripts/shard.py units ${{ matrix.shard }} "$SHARDS" | tr -d '\r')
          echo "units: $units"
          # shellcheck disable=SC2086
          cargo run -p e2e -- $units 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # The runner's artifacts go to `temp_dir()`, which is `%TMP%` on Windows.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - if: failure() || cancelled()
        # Should python itself be the fault, the diagnostics' tail still lands as annotations.
        run: |
          python .github/scripts/ci_annotate.py "$RUNNER_TEMP/shard.log" "$RUNNER_TEMP/e2e.log" ||
            tail -n 9 "$RUNNER_TEMP/shard.log" | sed 's/^/::error title=shard.log::/'
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-artifacts-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # The desktop arm on Windows (2783): the fixture app in WebView2, driven over its DevTools
  # port (`--remote-debugging-port`), so no input injection and no screen size are involved.
  windows-desktop:
    if: false
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-windows-desktop
      # The image lists no WebView2 runtime; wry's own CI installs it the same way. The
      # bootstrapper is a no-op when the Evergreen runtime is already there.
      - shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile "$env:RUNNER_TEMP\installwebview.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\installwebview.exe" -ArgumentList '/silent', '/install' -Wait
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime: $((Get-ItemProperty $key -ErrorAction SilentlyContinue).pv)"
      # The tests' feature: their build reuses the runner's target dir, not a second one (3407).
      - run: cargo run -p e2e --features desktop -- desktop 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          # The runner's artifacts and the WebView2 profiles go to `temp_dir()`, `%TMP%` here.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          # Inside the job's 45 min, after the cold build: a hang still uploads.
          E2E_DESKTOP_DEADLINE: 1500
      - if: failure() || cancelled()
        run: python .github/scripts/ci_annotate.py "$RUNNER_TEMP/e2e.log"
      # The `secure` notice and the probe test's assert confirm the secure origin (3231).
      - if: always()
        run: python .github/scripts/probe_notice.py "$RUNNER_TEMP/e2e-artifacts"
      # Always: the platform probe's JSON is the point of a green run too.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 3

  # The desktop arm on WebKitGTK (2874), as on a seat: the runner starts one Xvfb display and
  # drives the window with `xdotool`.
  linux-desktop:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # The `desktop` leg's build packages, libero's `dbus`, and the runner's display and input.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev fonts-dejavu-core xvfb xdotool
      - uses: ./.github/actions/setup
        with:
          cache-key: e2e
          save-cache: false
      - run: cargo run -p e2e --features desktop -- desktop 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - if: failure() || cancelled()
        run: python3 .github/scripts/ci_annotate.py "$RUNNER_TEMP/e2e.log"
      - if: always()
        run: python3 .github/scripts/probe_notice.py /tmp/e2e-artifacts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-artifacts
          path: /tmp/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 3

  android:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The NDK the emulator runs were verified with (codebase/platform/android-build.md).
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-linux-android
          components: clippy
          cache-key: android
          save-cache: false
      - uses: ./.github/actions/dx
      # `dx` finds the NDK only with ANDROID_HOME exported; the image sets it, the rest is ours.
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The launcher icon, as `just build-android` places it (docs/android.just `_android-icon`).
      - run: |
          res=target/dx/docs/debug/android/app/app/src/debug/res
          mkdir -p "$res"
          cp -r docs/android/res/. "$res"
      # No device attached to pick the ABI from, so name it.
      - working-directory: docs
        run: dx build --platform android --target aarch64-linux-android --debug-symbols=false --features mobile
      - uses: actions/upload-artifact@v7
        with:
          name: docs-android
          path: target/dx/docs/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - run: cargo clippy -p libero --all-targets --target aarch64-linux-android -- -D warnings

  # Simulator build, unsigned. Launching it is 1091.
  ios:
    if: false
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-apple-ios-sim
          cache-key: platforms-ios-e2e
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform ios --target aarch64-apple-ios-sim --debug-symbols=false --features mobile

  # The scenarios' `ios` arm in a simulator (2784), informational: the fixture app answers the
  # e2e bridge over loopback and AXe injects HID touches and keys. No phone, no signing.
  ios-e2e:
    if: false
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "5", "6"]
    runs-on: macos-26
    # One run of all units took 150 min (2875); a cold run spends ~35 min on the fixture build and install.
    timeout-minutes: 120
    env:
      SHARDS: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-apple-ios-sim
          cache-key: platforms-ios-e2e
      - uses: ./.github/actions/dx
      # Pinned to the tap commit the runs that drove the simulator used (2875); the version lands in the log.
      - run: |
          brew tap cameroncooke/axe
          git -C "$(brew --repository cameroncooke/axe)" checkout --detach "$AXE_TAP"
          brew install cameroncooke/axe/axe
          axe --version
        env:
          AXE_TAP: 64a21aa4c30e173280a0c3847b19a9a57dfcbfc0
      # What the image offers; the runner boots the newest runtime's first iPhone.
      - run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
      # HID keys as a hardware keyboard, so a focused field raises no soft keyboard.
      - run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
      # The runner prints `e2e ios: screen ..., viewport origin ...` per app launch.
      - run: |
          units=$(python3 .github/scripts/shard.py units ${{ matrix.shard }} "$SHARDS")
          echo "units: $units"
          # shellcheck disable=SC2086
          cargo run -p e2e -- ios $units 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          # The runner's artifacts go to `temp_dir()`, which is `$TMPDIR` on macOS.
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        run: python3 .github/scripts/ci_annotate.py "$RUNNER_TEMP/e2e.log"
      - if: always()
        run: python3 .github/scripts/probe_notice.py "$RUNNER_TEMP/e2e-artifacts"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-artifacts-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 3
