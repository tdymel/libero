# Builds the docs app once per platform (1219), dev profile, informational: not part of the
# required `ci` check. Only `macos-e2e` launches anything (2776).
name: Platforms

# On by default since the repo is public (standard runners are free there, macOS and Windows too).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: platforms-web
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: |
          dx build --platform web --debug-symbols=false
          ./preload_wasm.sh ../target/dx/docs/debug/web/public
      - uses: actions/upload-artifact@v7
        with:
          name: docs-web
          path: target/dx/docs/debug/web/public
          retention-days: 3

  # Blitz. `--platform linux` because two features map to a renderer, see docs/native.just.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libdbus-1-dev
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-native
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform linux --renderer native --debug-symbols=false --features native-vello

  # Whether Blitz and libero/native compile off Linux at all; a `dx build` once they do.
  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-native-check
          save-cache: false
      - run: cargo check -p docs --features native-vello

  # wry on the system WebView: WebKitGTK, WebView2, WKWebView.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-desktop
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform desktop --renderer webview --debug-symbols=false --features desktop

  # The e2e arms on macOS (2776). The desktop arm only builds: its driver is X11 (`xdotool`).
  macos-e2e:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: platforms-macos-e2e
          save-cache: false
      # The desktop arm against WKWebView: the fixture app and the test binary, no scenario run.
      - run: cargo build -p e2e-fixtures --features desktop
      - run: cargo test -p e2e --features desktop --test all --no-run
      # Both native test binaries in one cargo run, as ci.yml's `native` job.
      - run: cargo test -p e2e --features native --test native --test all --no-run
      # Probes: a WebView window in the runner's GUI session, and a wgpu adapter for Blitz.
      - continue-on-error: true
        run: python3 .github/scripts/window_probe.py desktop target/debug/e2e-fixtures probe
      - continue-on-error: true
        run: |
          system_profiler SPDisplaysDataType
          cargo build -p docs --features native-vello
          python3 .github/scripts/window_probe.py native target/debug/docs probe
      # The Blitz-only tests, then the shared scenarios on the Blitz backend; no display needed.
      - run: cargo test -p e2e --features native --test native
      - if: success() || failure()
        run: cargo test -p e2e --features native --test all -- ::native
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-probe
          path: probe
          if-no-files-found: ignore
          retention-days: 3

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The NDK the emulator runs were verified with (codebase/platform/android-build.md).
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-linux-android
          cache-key: platforms-android
          save-cache: false
      - uses: ./.github/actions/dx
      # `dx` finds the NDK only with ANDROID_HOME exported; the image sets it, the rest is ours.
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The launcher icon, as `just build-android` places it (docs/android.just `_android-icon`).
      - run: |
          res=target/dx/docs/debug/android/app/app/src/debug/res
          mkdir -p "$res"
          cp -r docs/android/res/. "$res"
      # No device attached to pick the ABI from, so name it.
      - working-directory: docs
        run: dx build --platform android --target aarch64-linux-android --debug-symbols=false --features mobile
      - uses: actions/upload-artifact@v7
        with:
          name: docs-android
          path: target/dx/docs/debug/android/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  # Simulator build, unsigned. Launching it is 1091.
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-apple-ios-sim
          cache-key: platforms-ios
          save-cache: false
      - uses: ./.github/actions/dx
      - working-directory: docs
        run: dx build --platform ios --target aarch64-apple-ios-sim --debug-symbols=false --features mobile
