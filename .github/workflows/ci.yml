# The `ted_gate.py` tiers as parallel jobs. Zero warnings via clippy `-D warnings` per
# configuration, not `RUSTFLAGS`, which also fails on warnings in the git-pinned dioxus and Blitz.
# The slow tiers run sharded (2592); `ci` is the one required check. Timeouts sit well above a
# cold build, far below GitHub's 6 h default, so a hang frees its runner (3407).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: CI prints no backtraces, and a Windows probe built 16% faster (3407).
  # The same in every workflow, since the cargo cache key hashes it.
  CARGO_PROFILE_DEV_DEBUG: 0
  # All 30 grammars.
  CODE_LANGS: code-lang-bash,code-lang-c,code-lang-cpp,code-lang-csharp,code-lang-css,code-lang-dart,code-lang-go,code-lang-graphql,code-lang-haskell,code-lang-html,code-lang-java,code-lang-javascript,code-lang-json,code-lang-kotlin,code-lang-lua,code-lang-markdown,code-lang-objective-c,code-lang-perl,code-lang-php,code-lang-powershell,code-lang-python,code-lang-r,code-lang-ruby,code-lang-rust,code-lang-scala,code-lang-sql,code-lang-swift,code-lang-toml,code-lang-typescript,code-lang-yaml

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: clippy
          cache-key: clippy
      - run: cargo clippy --workspace --all-targets --exclude e2e -- -D warnings
      - run: cargo clippy -p e2e --all-targets -- -D warnings

  # The libero configurations the gate does not build, and e2e with `native`.
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # `native` pulls Blitz's font stack (fontconfig, by pkg-config) and libero's `dbus` crate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libdbus-1-dev
      - uses: ./.github/actions/setup
        with:
          components: clippy
          cache-key: features
      - run: cargo clippy -p libero --all-targets --no-default-features --features test-features -- -D warnings
      - run: cargo clippy -p libero --all-targets --features full-polymorphism,test-features -- -D warnings
      - run: cargo clippy -p libero --all-targets --features native,test-features -- -D warnings
      - run: cargo clippy -p libero --all-targets --features "test-features,$CODE_LANGS" -- -D warnings
      - run: cargo clippy -p e2e --features native --all-targets -- -D warnings

  # Every component, layout and hook feature alone (3909), so a feature list that misses a
  # dependency fails here. Platform and test-only features are left out. The `wasm` leg is the
  # empty and the default build on wasm32. A shard takes ~5 min, all 186 runs ~15 min.
  each-feature:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          components: clippy
          cache-key: each-feature
      - if: matrix.shard != 'wasm'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - if: matrix.shard != 'wasm'
        run: cargo hack clippy -p libero --each-feature --exclude-features native,desktop,held-clock,fake-file-dialog,fcm,test-features --exclude-all-features --keep-going --partition ${{ matrix.shard }} -- -D warnings
      - if: matrix.shard == 'wasm'
        run: cargo clippy -p libero --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - if: matrix.shard == 'wasm'
        run: cargo clippy -p libero --target wasm32-unknown-unknown -- -D warnings

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          components: clippy
          cache-key: wasm
      - run: cargo clippy -p libero --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p docs --target wasm32-unknown-unknown -- -D warnings

  # The `cfg(target_os = "android")` code. The `cfg_attr` allows of `missing_const_for_thread_local`
  # in libero/src/lib.rs, tests/all/main.rs and render_cost.rs go once clippy stops flagging `const {}` (3343).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: aarch64-linux-android
          components: clippy
          cache-key: android
      - run: cargo clippy -p libero --all-targets --features test-features --target aarch64-linux-android -- -D warnings
      - run: cargo clippy -p libero --all-targets --features fcm,test-features --target aarch64-linux-android -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - run: cargo test -p libero --features test-features --lib --tests
      - run: cargo test -p libero --lib --features "test-features,$CODE_LANGS" highlight
      - run: cargo test -p libero --lib --features test-features chart
      # The harness's own unit tests (exact filters, console classifier, focus-ring maths): no browser.
      - run: cargo test -p e2e --lib --bins
      # The two file checks of the browser suite, which the unit shards below never select.
      - run: cargo test -p e2e --test all -- --exact every_test_file_is_registered every_ax_baseline_is_referenced

  doc-tests:
    strategy:
      fail-fast: false
      matrix:
        part: [docs, libero-doc, no-default]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # One cache for the three parts: the 10 GiB budget is shared with every other job.
          cache-key: doc-tests
      - if: matrix.part == 'docs'
        run: cargo test -p docs
      # `page_snippets` writes the gitignored `libero/tests/page_snippets.md` that every libero
      # doc-test run compiles (`md_examples.rs`), so both libero legs need it first.
      - if: matrix.part != 'docs'
        run: cargo test -p docs page_snippets
      - if: matrix.part == 'libero-doc'
        run: cargo test -p libero --features test-features --doc
      # The chart docs and their pages' snippets compile only with the feature.
      - if: matrix.part == 'libero-doc'
        run: cargo test -p libero --doc --features test-features -- chart Chart
      # Likewise the Firebase page and its snippets with `fcm`.
      - if: matrix.part == 'libero-doc'
        run: cargo test -p libero --doc --features fcm,test-features -- fcm Fcm
      - if: matrix.part == 'no-default'
        run: cargo test -p libero --no-default-features --features test-features

  # One job: three shards built the same binaries three times for under a minute of tests (3413).
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Blitz's font stack links fontconfig; libero's `dbus` crate needs libdbus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libdbus-1-dev fonts-dejavu-core xvfb
      - uses: ./.github/actions/setup
        with:
          cache-key: native
      # Both test binaries in one cargo run, so they build side by side (the gate's `native-build`).
      - run: cargo test -p e2e --features native --test native --test all --no-run
      # The Blitz-only tests: paint, stylo, Blitz's event order.
      - run: cargo test -p e2e --features native --test native
      # The shared e2e scenarios on the Blitz backend (822).
      - if: success() || failure()
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p e2e --features native --test all -- ::native

  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", sweep]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
          cache-key: e2e
      - uses: ./.github/actions/dx
      # Pinned: the AX snapshots follow Chrome's tree. Bump it in the same commit as the
      # re-blessed snapshots (brain: codebase/testing/e2e-harness).
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 152.0.7977.82
      - run: '"${{ steps.chrome.outputs.chrome-path }}" --version'
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `unit::` filters: the runner builds only those units' fixture modules.
      - if: matrix.shard != 'sweep'
        run: |
          units=$(python3 .github/scripts/shard.py units ${{ matrix.shard }} "$SHARDS")
          echo "units: $units"
          # shellcheck disable=SC2086
          cargo run -p e2e -- $units
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # The docs behaviour tests in e2e/tests/sweep.rs no other run reaches (1708).
      - if: matrix.shard == 'sweep'
        run: cargo run -p e2e -- sweep a_route_change the_landing a_combobox
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: /tmp/e2e-artifacts
          if-no-files-found: ignore

  # The one required check: green only when every job above is.
  ci:
    if: always()
    needs: [fmt, clippy, features, each-feature, wasm, android, test, doc-tests, native, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all CI jobs green"
