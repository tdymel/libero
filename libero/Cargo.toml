[package]
name = "libero"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "router", "wasm-split"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }

[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load", "dump-create"] }
sha2 = { version = "0.11.0", default-features = false }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[features]
# Each enabled language's `.sublime-syntax` grammar is fetched at build time
# (see build.rs) and compiled into a single-purpose SyntaxSet - only the
# languages you turn on end up in the binary.
default = [
    "code-lang-rust",
    "code-lang-shell",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
]
code-lang-rust = []
code-lang-shell = []
code-lang-markdown = []
code-lang-html = []
code-lang-css = []
