[package]
name = "libero"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
# TEMPORARY: upstream dioxus main by git, pinned by rev in Cargo.lock, instead
# of the crates.io 0.7.10 release. `dx` must come from the same rev (see
# ci.yml's e2e job), or CLI and app speak different wire protocols. Unwind
# back to a crates.io version before any real release: a git dep blocks
# publishing to crates.io. The unwind also updates the dioxus version in the
# Getting started page (`getting_started.rs` and its md), so the two move together.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "mounted", "router", "logger"] }
fast_qr = { version = "0.13.1", default-features = false, features = ["svg"] }
libero-macros = { path = "../libero-macros", version = "0.1.0" }
# The date and time components hold `chrono`'s naive types. No `clock` here:
# on the web today comes from JS `Date`, so chrono pulls in no second `js-sys`
# path. Native turns `clock` on below for `Local`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `Pictogram`'s glyph data, and lucide for the library's own glyphs. Zero deps
# besides core. 0.x: pinned to 0.5, an app on another minor has a second `SvgData` type.
pictogram-core = "0.5"
pictogram-icons-lucide = "0.5"
# Brand marks: `Tldr`'s providers (lobe), `Repository`'s hosts (simple). Unused consts compile away.
pictogram-icons-lobe = "0.5"
pictogram-icons-simple = "0.5"
# Whole sets for `IconProvider`, one `icons-<set>` feature each (`IconSet::material_rounded()`, ...).
pictogram-icons-bootstrap = { version = "0.5", optional = true }
pictogram-icons-material = { version = "0.5", optional = true }
pictogram-icons-phosphor = { version = "0.5", optional = true }
pictogram-icons-tabler = { version = "0.5", optional = true }
# `Repository` reads a host's JSON reply. Already in every graph through `dioxus-document`.
serde_json = "1"
# The rich text editor's `Doc`, the format of record. Already in the graph through dioxus.
serde = { version = "1", features = ["derive"] }
# Only to name `NativeFileData::byte_stream`'s return type for a picked or
# cropped file. Already in dioxus's tree.
futures-core = "0.3"

# Everything web-specific is wasm32-only, so a native build (`cargo test`, or
# any future non-web renderer) compiles without it and the platform-backed
# APIs return `PlatformError::Unsupported` instead of panicking inside
# wasm-bindgen. `Code`'s highlighter uses the browser's own `RegExp` engine
# via `js_sys` there; the `regex` crate below is its non-web counterpart,
# never compiled for wasm32 at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# 0.2.128+ imports a wasm exception tag (`__wbindgen_jstag`) that dx's hotpatch parser rejects.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "HtmlElement", "HtmlFormElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlSelectElement", "HtmlTextAreaElement", "DataTransfer", "DataTransferItem", "DataTransferItemList", "File", "FileList", "FilePropertyBag", "NodeList", "Navigator", "ScrollBehavior", "ScrollToOptions", "Clipboard", "CssStyleDeclaration", "DomRect", "KeyboardEvent", "MediaError", "MediaQueryList", "MutationObserver", "MutationObserverInit", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Storage", "MouseEvent", "FocusEvent", "FocusOptions", "PointerEvent", "TransitionEvent", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only for `serialize`, which is what defines `SerializedTransitionData` - the
# type the desktop and Android WebView hand every `transitionend` over as, so
# `platform::transition_property` can read the property there. A desktop app
# turns it on anyway through dioxus-desktop. Adds `serde_json` and
# `serde_repr` to a native build; the wasm32 graph is untouched (measured
# 2026-09-19, todo 36a).
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", default-features = false, features = ["serialize"] }
regex = "1"
# `Local`, for today off the web: the system time zone via `iana-time-zone`.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Blitz's `NodeHandle`, which is what a `MountedData` downcasts to under
# dioxus-native - the whole `platform::ElementApi` is answerable from it, DOM
# queries included. Only pulled in by the `native` feature; without it a
# native build still measures and focuses through dioxus's own mounted API.
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", optional = true }
# `NodeHandle` hands back a `BaseDocument`, which `dioxus-native-dom` does not
# re-export. Same crates.io version as dioxus-native's, so cargo keeps one copy.
# `svg` (on in dioxus-native's too): `natural_size` reads an SVG picture's size.
blitz-dom = { version = "0.3.0-beta.2", optional = true, default-features = false, features = ["svg"] }
blitz-traits = { version = "0.3.0-beta.2", optional = true }
# Only to name `ShellProvider::set_cursor`'s argument; blitz-traits' own copy.
cursor-icon = { version = "1.2", optional = true }
# Stylo's computed values, for `ElementApi::computed_px`. The version blitz-dom uses.
style = { package = "stylo", version = "0.20", optional = true }
# Our own clipboard handle rather than the shell's: `blitz-shell` builds an
# `arboard::Clipboard` per call and drops it, and arboard's X11 backend
# destroys the window that *owns* the selection on the last drop - so the
# copied text is gone before anything can paste it. Same version and feature
# set as blitz-shell's, so cargo keeps one copy.
arboard = { version = "3.6", optional = true, default-features = false }
# The file dialog Blitz does not open for `input[type=file]`. The portal
# backend only, as blitz-shell's copy in the lock, so no second copy.
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
# `FileField { crop }`'s cut where Blitz has no canvas. blitz-dom's copy; the
# codecs are the types the crop keeps, plus BMP to read.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# Turns Blitz's callback-style fetch into a future. Already in dioxus's tree.
futures-channel = { version = "0.3", optional = true }
# The `desktop` feature's window handle, to raise it on a notification click (todo 1424).
# Already in every desktop app's tree, defaults on (dioxus asks for them); without
# these two it does not build alone. The same crate as Android's entry.
dioxus-desktop = { git = "https://github.com/DioxusLabs/dioxus", default-features = false, features = ["tokio_runtime", "devtools"], optional = true }

# The desktop portal's accessibility settings, which Blitz's stylo cannot match (todo 954).
# The lock's copy (tao's).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }

# Android system notifications (todo 1348): JNI on the main thread through wry's
# `dispatch`, and tao's `Opened` for a tap. Already in every dioxus mobile app's tree;
# the two features as the desktop entry above, or a lone Android check fails (todo 1489).
[target.'cfg(target_os = "android")'.dependencies]
dioxus-desktop = { git = "https://github.com/DioxusLabs/dioxus", default-features = false, features = ["tokio_runtime", "devtools"] }
futures-channel = "0.3"

# Render-to-string, for the component tests in `tests/` - the same dioxus rev
# this crate builds against.
[dev-dependencies]
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus" }
# Only to name `NativeFileData::byte_stream`'s return type in a fake file.
futures-core = "0.3"
# The layering rules in `tests/all/architecture.rs`, checked on the source files.
archunit = "0.0.1"

[features]
# Reach elements through Blitz directly when running under `dioxus-native`.
# Nothing forces it on: without it `platform::backend` falls back to dioxus's
# portable mounted handle, which cannot query a subtree or report focus.
native = ["dep:dioxus-native-dom", "dep:blitz-dom", "dep:blitz-traits", "dep:cursor-icon", "dep:style", "dep:arboard", "dep:rfd", "dep:image", "dep:futures-channel", "dep:dbus"]
# The desktop WebView (`dioxus/desktop`) on Linux: WebKitGTK denies the page's
# `Notification`, so system notifications go over the session bus (todo 1470).
desktop = ["dep:futures-channel", "dep:dbus", "dep:dioxus-desktop"]
default = [
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
]
# `Box` (and anything built on it - `Title`, `Text`, `Icon`, ...) can render
# as any of the 111 HTML5 elements via `component: HtmlTag::...`/a tag name
# string, but `render_polymorphic` only compiles a match arm per tag in the
# `default` tier - the 83 elements a page is written out of. This feature
# compiles the remaining 28: document metadata (`head`, `meta`, `title`,
# `script`, `style`, `link`, `base`, `body`, `noscript`), embedded and media
# content (`iframe`, `canvas`, `audio`, `video`, `picture`, `source`,
# `track`, `embed`, `object`, `param`, `map`, `area`), web components
# (`template`, `slot`) and the bidi/ruby set (`bdi`, `bdo`, `ruby`, `rp`,
# `rt`). See `polymorphic.rs`'s `html_tags!` invocation for the two lists.
#
# A `full`-tier tag always type-checks; without the feature it renders as a
# `<div>` and warns in a debug build (and silently in release), so turn this
# on if your own app passes one to `component`.
full-polymorphism = []
# Each adds one pictogram set's `IconSet` constructors. Off by default: libero's
# own glyphs are lucide without any, and the crates are large to compile.
icons-bootstrap = ["dep:pictogram-icons-bootstrap"]
icons-material = ["dep:pictogram-icons-material"]
icons-phosphor = ["dep:pictogram-icons-phosphor"]
icons-tabler = ["dep:pictogram-icons-tabler"]
# Each turns on one hand-ported grammar in `components/typography/code/languages/`
# (see `language_catalog.rs`) - only the languages you enable are compiled in.
code-lang-bash = []
code-lang-c = []
code-lang-cpp = []
code-lang-csharp = []
code-lang-css = []
code-lang-dart = []
code-lang-go = []
code-lang-graphql = []
code-lang-haskell = []
code-lang-html = []
code-lang-java = []
code-lang-javascript = []
code-lang-json = []
code-lang-kotlin = []
code-lang-lua = []
code-lang-markdown = []
code-lang-objective-c = []
code-lang-perl = []
code-lang-php = []
code-lang-powershell = []
code-lang-python = []
code-lang-r = []
code-lang-ruby = []
code-lang-rust = []
code-lang-scala = []
code-lang-sql = []
code-lang-swift = []
code-lang-toml = []
code-lang-typescript = []
code-lang-yaml = []
