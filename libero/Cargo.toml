[package]
name = "libero"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
# TEMPORARY: local path dep against .dioxus-fork (tracks dioxus main, plus
# our own still-needed fixes - see .dioxus-fork/BUGS.md) instead of the
# crates.io 0.7.10 release, so this crate and the `dx` CLI building it are
# always built from identical source - avoids wire-protocol version-skew
# bugs between the two (see BUGS.md, "Building docs against main's dx").
# Unwind back to a crates.io version before any real release - a path dep
# blocks publishing to crates.io entirely, and .dioxus-fork isn't checked
# in, so nobody else can build this as-is.
dioxus = { path = "../.dioxus-fork/packages/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "router"] }
fast_qr = { version = "0.13.1", default-features = false, features = ["svg"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }

[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load", "dump-create"] }
sha2 = { version = "0.11.0", default-features = false }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[features]
# Each enabled language's `.sublime-syntax` grammar is fetched at build time
# (see build.rs, sourced from the catalog in
# src/components/typography/code/language_catalog.rs) and compiled into a
# single-purpose SyntaxSet - only the languages you turn on end up in the
# binary. `default` keeps the original curated set; the rest is every
# language syntect's grammar loader accepts, opt-in.
default = [
    "wasm-split",
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
]
# `Code`'s syntax highlighting and `QrCode`'s encoding both pull in a large
# dependency (syntect's grammar set, `fast_qr`) that's only needed lazily -
# with this on, they're `#[wasm_split]` out into a chunk fetched on first
# use instead of the main bundle, which only pays off if the consumer's own
# build also passes `dx build`/`dx serve --wasm-split`. Turn this off (via
# `default-features = false`) to get a plain, un-split build that works with
# a normal `dx serve`/`dx build` - both components render identically
# either way, just from the main bundle instead of a lazy-loaded one.
wasm-split = ["dioxus/wasm-split"]
code-lang-actionscript = []
code-lang-applescript = []
code-lang-asp = []
code-lang-bash = []
code-lang-batch-file = []
code-lang-bibtex = []
code-lang-c = []
code-lang-cabal = []
