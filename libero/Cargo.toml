[package]
name = "libero"
version = "0.3.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
# Exact pin: libero reaches into dioxus-native-dom internals, which an alpha may change.
# `dx` must be the same version (see ci.yml's e2e job), or CLI and app speak different wire protocols.
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "mounted", "router", "logger"] }
fast_qr = { version = "0.13.1", default-features = false, features = ["svg"], optional = true }
libero-macros = { path = "../libero-macros", version = "0.2.0" }
# The date and time components hold `chrono`'s naive types. No `clock` here:
# on the web today comes from JS `Date`, so chrono pulls in no second `js-sys`
# path. Native turns `clock` on below for `Local`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `Pictogram`'s glyph data, and lucide for the library's own glyphs. Zero deps
# besides core. 0.x: pinned to 0.5, an app on another minor has a second `SvgData` type.
pictogram-core = "0.5"
pictogram-icons-lucide = "0.5"
# Brand marks: `Tldr`'s providers (lobe), `Repository`'s hosts (simple). Unused consts compile away.
pictogram-icons-lobe = { version = "0.5", optional = true }
pictogram-icons-simple = { version = "0.5", optional = true }
# Whole sets for `IconProvider`, one `icons-<set>` feature each (`IconSet::material_rounded()`, ...).
pictogram-icons-bootstrap = { version = "0.5", optional = true }
pictogram-icons-material = { version = "0.5", optional = true }
pictogram-icons-phosphor = { version = "0.5", optional = true }
pictogram-icons-tabler = { version = "0.5", optional = true }
# `Repository` reads a host's JSON reply. Already in every graph through `dioxus-document`.
serde_json = "1"
# The rich text editor's `Doc`, the format of record. Already in the graph through dioxus.
serde = { version = "1", features = ["derive"] }
# Only to name `NativeFileData::byte_stream`'s return type for a picked or
# cropped file. Already in dioxus's tree.
futures-core = "0.3"
# The charts' SVG, behind `charts`. Exact pin: libero reads geometry out of its SVG text,
# a format only the contract test in `chart/engine.rs` guards.
charts-rs = { version = "=2.1.0", optional = true, default-features = false }

# Everything web-specific is wasm32-only, so a native build (`cargo test`, or
# any future non-web renderer) compiles without it and the platform-backed
# APIs return `PlatformError::Unsupported` instead of panicking inside
# wasm-bindgen. `Code`'s highlighter uses the browser's own `RegExp` engine
# via `js_sys` there; the `regex` crate below is its non-web counterpart,
# never compiled for wasm32 at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# 0.2.128+ imports a wasm exception tag (`__wbindgen_jstag`) that dx's hotpatch parser rejects.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "HtmlElement", "HtmlFormElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlSelectElement", "HtmlTextAreaElement", "DataTransfer", "DataTransferItem", "DataTransferItemList", "File", "FileList", "FilePropertyBag", "NodeList", "Navigator", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollToOptions", "Clipboard", "CssStyleDeclaration", "DomRect", "KeyboardEvent", "MediaError", "MediaQueryList", "MutationObserver", "MutationObserverInit", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "ResizeObserver","Storage", "StorageEvent", "BroadcastChannel", "MessageEvent", "DomException", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "MouseEvent", "FocusEvent", "FocusOptions", "PointerEvent", "TransitionEvent", "console", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlStyleElement", "StyleSheet", "CssStyleSheet", "CssRule", "CssRuleList", "CssGroupingRule"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only for `serialize`, which is what defines `SerializedTransitionData` - the
# type the desktop and Android WebView hand every `transitionend` over as, so
# `platform::transition_property` can read the property there. A desktop app
# turns it on anyway through dioxus-desktop. Adds `serde_json` and
# `serde_repr` to a native build; the wasm32 graph is untouched (measured
# 2026-09-19, todo 36a).
dioxus-html = { version = "=0.8.0-alpha.3", default-features = false, features = ["serialize"] }
regex = "1"
# The `collation` feature's Table sort by a language's rules off the web, where the browser has no `Intl.Collator`.
icu_collator = { version = "2", optional = true }
icu_locale_core = { version = "2", optional = true }
# `use_local_storage`'s directory under `native`/`desktop`. The lock's copy (wry's).
dirs = "7"
# `Local`, for today off the web: the system time zone via `iana-time-zone`.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Blitz's `NodeHandle`, which is what a `MountedData` downcasts to under
# dioxus-native - the whole `platform::ElementApi` is answerable from it, DOM
# queries included. Only pulled in by the `native` feature; without it a
# native build still measures and focuses through dioxus's own mounted API.
dioxus-native-dom = { version = "=0.8.0-alpha.3", optional = true }
# `NodeHandle` hands back a `BaseDocument`, which `dioxus-native-dom` does not
# re-export. Same crates.io version as dioxus-native's, so cargo keeps one copy.
# `svg` (on in dioxus-native's too): `natural_size` reads an SVG picture's size.
blitz-dom = { version = "0.3.0-beta.4", optional = true, default-features = false, features = ["svg"] }
blitz-traits = { version = "0.3.0-beta.4", optional = true }
# Only to name `ShellProvider::set_cursor`'s argument; blitz-traits' own copy.
cursor-icon = { version = "1.2", optional = true }
# Stylo's computed values, for `ElementApi::computed_px`. The version blitz-dom uses.
style = { package = "stylo", version = "0.22", optional = true }
# `platform::media_query` natively: stylo's media query parser takes these. stylo's copies.
style_traits = { package = "stylo_traits", version = "0.22", optional = true }
cssparser = { version = "0.38", optional = true }
url = { version = "2", optional = true }
# Our own clipboard handle rather than the shell's: `blitz-shell` builds an
# `arboard::Clipboard` per call and drops it, and arboard's X11 backend
# destroys the window that *owns* the selection on the last drop - so the
# copied text is gone before anything can paste it. Same version and feature
# set as blitz-shell's, so cargo keeps one copy.
arboard = { version = "3.6", optional = true, default-features = false }
# The file dialog Blitz does not open for `input[type=file]`, and the save
# dialog of `save_file` (Blitz, desktop WebView). The portal backend only, as
# blitz-shell's copy in the lock, so no second copy.
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
# `FileField { crop }`'s cut where Blitz has no canvas. blitz-dom's copy; the
# codecs are the types the crop keeps, plus BMP to read.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# Turns Blitz's callback-style fetch into a future. Already in dioxus's tree.
futures-channel = { version = "0.3", optional = true }
# The `desktop` feature's window handle, to raise it on a notification click (todo 1424).
# Already in every desktop app's tree, defaults on (dioxus asks for them); without
# these two it does not build alone. The same crate as Android's entry.
dioxus-desktop = { version = "=0.8.0-alpha.3", default-features = false, features = ["tokio_runtime", "devtools"], optional = true }

# The desktop portal's accessibility settings, which Blitz's stylo cannot match (todo 954).
# The lock's copy (tao's).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }

# Blitz's accessibility settings on Windows and macOS (todo 972). The lock's copies (dirs-sys', rfd's).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

# Android system notifications (todo 1348): JNI on the main thread through wry's
# `dispatch`, and tao's `Opened` for a tap. Already in every dioxus mobile app's tree;
# the two features as the desktop entry above, or a lone Android check fails (todo 1489).
[target.'cfg(target_os = "android")'.dependencies]
dioxus-desktop = { version = "=0.8.0-alpha.3", default-features = false, features = ["tokio_runtime", "devtools"] }
futures-channel = "0.3"
# `#[ffi]` ships `android/share` (todo 3408) as a Gradle module into the app.
manganis = { version = "=0.8.0-alpha.3", default-features = false }

# Render-to-string, for the component tests in `tests/` - the same dioxus rev
# this crate builds against.
[dev-dependencies]
dioxus-ssr = { version = "=0.8.0-alpha.3" }
# Only to name `NativeFileData::byte_stream`'s return type in a fake file.
futures-core = "0.3"
# The layering rules in `tests/all/architecture.rs`, checked on the source files.
archunit = "0.0.1"
# `tests/all/hook_order.rs` walks the source for a hook behind a branch. archunit's copy.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
# The use_timers page's printed stopwatch, compiled as a doc-test.
web-time = "1.1"
# The tests cover every component and hook (todos 3887, 3922), and the grammars the old default had (todo 3918).
libero = { path = ".", features = ["all-components", "all-hooks", "code-lang-rust", "code-lang-bash", "code-lang-markdown", "code-lang-html", "code-lang-css"] }

[features]
# Reach elements through Blitz directly when running under `dioxus-native`.
# Nothing forces it on: without it `platform::backend` falls back to dioxus's
# portable mounted handle, which cannot query a subtree or report focus.
native = ["dep:dioxus-native-dom", "dep:blitz-dom", "dep:blitz-traits", "dep:cursor-icon", "dep:style", "dep:style_traits", "dep:cssparser", "dep:url", "dep:arboard", "dep:rfd", "dep:image", "dep:futures-channel", "dep:dbus", "dep:windows-sys", "dep:objc2-app-kit"]
# The desktop WebView (`dioxus/desktop`) on Linux: WebKitGTK denies the page's
# `Notification`, so system notifications go over the session bus (todo 1470).
# `save_file` opens rfd's save dialog there, as under `native` (todo 2016).
desktop = ["dep:futures-channel", "dep:dbus", "dep:dioxus-desktop", "dep:rfd"]
# For e2e harnesses only (todo 2144): `platform::held_clock` holds the thread timer's
# named delays until fired, as a test clock. Never in an app build.
held-clock = []
# `use_fcm` (todo 3404): Firebase Cloud Messaging on Android. Ships the Gradle module
# `android/fcm` and firebase-messaging into the app, so it is off by default.
fcm = []
# `Table` sorts text by the app's language off the web too (todo 3420), as the browser's
# `Intl.Collator` does. Off by default: its collation data adds to a desktop, Android or native binary.
collation = ["dep:icu_collator", "dep:icu_locale_core"]
# For e2e harnesses only (todo 1514): under `native`, `platform::fake_file_dialog`
# answers the next pick in place of rfd's dialog. Never in an app build.
fake-file-dialog = []
# The layout, the common components and the common hooks (todo 3922). Without it and with
# no features, no component and no hook compiles. Docs: /about/features.
default = ["layout", "text", "title", "anchor", "kbd", "mark", "blockquote", "button", "action-icon", "icon", "alert", "loader", "tooltip", "dialog", "modal", "form-root", "fieldset", "text-field", "checkbox", "switch", "select", "use-media-query", "use-color-scheme", "use-clipboard", "use-debounce", "use-timers", "use-hotkeys", "use-local-storage"]
# `Box` (and anything built on it - `Title`, `Text`, `Icon`, ...) can render
# as any of the 111 HTML5 elements via `component: HtmlTag::...`/a tag name
# string, but `render_polymorphic` only compiles a match arm per tag in the
# `default` tier - the 83 elements a page is written out of. This feature
# compiles the remaining 28: document metadata (`head`, `meta`, `title`,
# `script`, `style`, `link`, `base`, `body`, `noscript`), embedded and media
# content (`iframe`, `canvas`, `audio`, `video`, `picture`, `source`,
# `track`, `embed`, `object`, `param`, `map`, `area`), web components
# (`template`, `slot`) and the bidi/ruby set (`bdi`, `bdo`, `ruby`, `rp`,
# `rt`). See `polymorphic.rs`'s `html_tags!` invocation for the two lists.
#
# A `full`-tier tag always type-checks; without the feature it renders as a
# `<div>` and warns in a debug build (and silently in release), so turn this
# on if your own app passes one to `component`.
full-polymorphism = []
# Each adds one pictogram set's `IconSet` constructors. Off by default: libero's
# own glyphs are lucide without any, and the crates are large to compile.
icons-bootstrap = ["dep:pictogram-icons-bootstrap"]
icons-material = ["dep:pictogram-icons-material"]
icons-phosphor = ["dep:pictogram-icons-phosphor"]
icons-tabler = ["dep:pictogram-icons-tabler"]
# Each turns on one hand-ported grammar in `components/typography/code/languages/`
# (see `language_catalog.rs`) - only the languages you enable are compiled in.
code-lang-bash = ["code"]
code-lang-c = ["code"]
code-lang-cpp = ["code"]
code-lang-csharp = ["code"]
code-lang-css = ["code"]
code-lang-dart = ["code"]
code-lang-go = ["code"]
code-lang-graphql = ["code"]
code-lang-haskell = ["code"]
code-lang-html = ["code"]
code-lang-java = ["code"]
code-lang-javascript = ["code"]
code-lang-json = ["code"]
code-lang-kotlin = ["code"]
code-lang-lua = ["code"]
code-lang-markdown = ["code"]
code-lang-objective-c = ["code"]
code-lang-perl = ["code"]
code-lang-php = ["code"]
code-lang-powershell = ["code"]
code-lang-python = ["code"]
code-lang-r = ["code"]
code-lang-ruby = ["code"]
code-lang-rust = ["code"]
code-lang-scala = ["code"]
code-lang-sql = ["code"]
code-lang-swift = ["code"]
code-lang-toml = ["code"]
code-lang-typescript = ["code"]
code-lang-yaml = ["code"]

# Components (todo 3887): one feature per component, a component's feature turns on the
# ones it is built from, layout and hooks included (todo 3922). Only the shared helpers are
# always compiled.
# Docs: /about/features.
all-components = ["accessibility", "buttons", "data-display", "feedback", "form", "layout", "navigation", "overlay", "typography"]

accessibility = ["focus-trap", "visually-hidden"]
focus-trap = ["use-focus-return", "visually-hidden"]
visually-hidden = ["box"]

buttons = ["action-icon", "button", "button-group", "copy", "direction-toggle", "repository", "share", "theme-switcher", "tldr", "toolbar"]
action-icon = ["loader", "tooltip", "kbd", "anchor", "paper", "pictogram", "use-hotkeys", "use-id"]
button = ["loader", "anchor"]
button-group = ["box"]
copy = ["action-icon", "use-clipboard"]
direction-toggle = ["action-icon", "use-direction"]
# Pulls in the simple-icons brand marks.
repository = ["action-icon", "dep:pictogram-icons-simple", "use-local-storage"]
share = ["action-icon", "icon", "button", "use-share"]
theme-switcher = ["menu", "action-icon", "use-color-scheme"]
# Pulls in the lobe-icons brand marks.
tldr = ["chip", "menu", "icon", "action-icon", "dep:pictogram-icons-lobe"]
toolbar = ["box", "use-hotkeys"]

data-display = ["accordion", "audio", "avatar", "badge", "carousel", "charts", "data-list", "icon", "image", "image-list", "indicator", "kanban", "list", "marquee", "pictogram", "qr-code", "sortable", "table", "timeline", "video"]
accordion = ["collapse", "use-icon", "use-id"]
audio = ["slider", "menu", "button", "modal", "action-icon", "shortcut-help", "use-fullscreen", "use-media"]
avatar = ["tooltip", "use-icon", "use-id", "visually-hidden"]
badge = ["box"]
carousel = ["action-icon", "scroll-area"]
# `LineChart` and its kin, drawn by charts-rs (+~240 KB brotli on the web).
charts = ["skeleton", "mark", "dep:charts-rs", "focus-trap", "use-accessibility", "use-popover", "use-debounce", "use-id", "use-icon"]
data-list = ["box"]
icon = ["pictogram", "visually-hidden"]
# `zoomable` opens the lightbox only with `lightbox` on; else the picture renders unzoomable.
image = ["box"]
image-list = ["image", "grid"]
indicator = ["box"]
kanban = ["sortable", "menu", "focus-trap"]
list = ["box"]
marquee = ["action-icon"]
pictogram = ["use-icon"]
qr-code = ["dep:fast_qr", "box"]
sortable = ["use-drag", "use-icon", "use-id", "use-media-query", "use-timers", "visually-hidden"]
# With `date-time` on, a date filter picks from a `DateField`; else from the native date input.
table = ["badge", "progress-bar", "skeleton", "checkbox", "native-select", "select", "text-field", "pagination", "menu", "sortable", "icon", "action-icon", "button", "collapse", "use-debounce"]
timeline = ["visually-hidden"]
video = ["slider", "menu", "button", "modal", "action-icon", "shortcut-help", "use-fullscreen", "use-media"]

feedback = ["alert", "circular-progress", "loader", "notifications", "progress-bar", "skeleton"]
alert = ["action-icon"]
circular-progress = ["box", "use-accessibility"]
loader = ["box"]
notifications = ["alert", "button", "float"]
progress-bar = ["slider"]
skeleton = ["box"]

form = ["autocomplete", "cascader", "checkbox", "chip", "color", "combobox", "date-time", "fieldset", "file-field", "form-root", "image-cropper", "native-select", "number-field", "password-field", "phone-field", "pin-field", "radio", "radio-group", "rating", "rich-text-editor", "segmented-control", "select", "slider", "switch", "tags-field", "text-field", "textarea"]
autocomplete = ["combobox", "action-icon"]
cascader = ["combobox", "action-icon", "use-media-query"]
checkbox = ["use-icon", "use-id", "visually-hidden"]
chip = ["action-icon", "anchor"]
color = ["slider", "action-icon", "use-media-query", "use-swipe", "use-timers"]
combobox = ["loader", "paper", "scroll-area", "use-id", "use-popover", "visually-hidden", "use-icon", "use-swipe", "use-media-query", "use-timers"]
date-time = ["tabs", "action-icon", "button", "use-drag", "use-media-query", "use-swipe", "use-timers"]
fieldset = ["box", "use-icon", "use-id", "visually-hidden"]
# `Form`, `use_form` and `FormHandle`; `form` is the group of every form component.
form-root = ["alert"]
# `crop` opens its dialog only with `image-cropper` on; else the file passes uncropped.
file-field = ["chip", "select", "alert", "modal", "action-icon", "button", "dialog", "loader"]
image-cropper = ["slider", "action-icon"]
native-select = ["combobox", "select"]
number-field = ["action-icon"]
password-field = ["text-field", "action-icon"]
phone-field = ["combobox"]
pin-field = ["use-icon", "visually-hidden", "use-id"]
radio = ["use-accessibility", "use-icon", "visually-hidden", "use-id"]
radio-group = ["radio"]
rating = ["use-icon", "visually-hidden", "use-id", "use-drag"]
rich-text-editor = ["toolbar", "text-field", "menu", "code", "mark", "modal", "action-icon", "button", "dialog", "shortcut-help", "text", "flex", "use-history"]
segmented-control = ["button", "use-id"]
select = ["combobox", "chip", "action-icon", "button"]
slider = ["tooltip", "use-icon", "visually-hidden", "use-id", "use-drag"]
switch = ["use-accessibility", "use-icon", "visually-hidden", "use-id"]
tags-field = ["combobox", "chip", "select", "action-icon"]
text-field = ["use-icon", "visually-hidden", "use-id"]
textarea = ["use-debounce", "use-icon", "visually-hidden", "use-id"]

navigation = ["anchor", "burger", "menubar", "nav-link", "navigation-bar", "pagination", "stepper", "tabs", "tree"]
anchor = ["use-icon", "visually-hidden"]
burger = ["action-icon"]
menubar = ["menu"]
nav-link = ["tree", "anchor", "collapse", "use-id"]
navigation-bar = ["nav-link", "float"]
pagination = ["action-icon"]
stepper = ["collapse", "use-icon", "use-id", "visually-hidden"]
tabs = ["use-id", "use-icon", "visually-hidden"]
tree = ["list", "icon", "use-popover"]

overlay = ["dialog", "drawer", "floating-window", "hover-card", "lightbox", "menu", "modal", "overlay-backdrop", "shortcut-help", "spotlight", "tooltip", "tour"]
dialog = ["action-icon", "title"]
drawer = ["dialog", "modal", "float", "use-swipe"]
floating-window = ["menu", "action-icon", "button", "title", "float", "use-drag"]
hover-card = ["paper", "scroll-area", "use-popover", "use-timers"]
lightbox = ["carousel", "modal", "action-icon", "dialog"]
menu = ["anchor", "kbd", "divider", "paper", "use-popover", "use-timers"]
# `Modal` and `use_modal`.
modal = ["overlay-backdrop", "focus-trap", "use-back"]
# The `Overlay` component; `overlay` is the group of every overlay component.
overlay-backdrop = ["box"]
shortcut-help = ["dialog", "kbd", "use-element", "use-hotkeys"]
spotlight = ["combobox", "dialog", "modal", "kbd", "loader"]
tooltip = ["use-timers", "box", "use-popover"]
tour = ["dialog", "button", "focus-trap", "use-accessibility", "use-local-storage", "use-back"]

layout = ["aspect-ratio", "box", "center", "collapse", "container", "divider", "flex", "float", "grid", "header", "paper", "scroll-area", "scroller", "sidebar", "splitter", "transition"]
aspect-ratio = ["box"]
box = ["use-element"]
center = ["box"]
collapse = ["box", "use-timers"]
container = ["box"]
divider = ["use-id", "use-icon", "visually-hidden"]
flex = ["box"]
float = ["box"]
grid = ["box"]
header = ["paper", "use-id", "use-icon", "visually-hidden"]
paper = ["box"]
scroll-area = ["box", "use-drag"]
scroller = ["scroll-area", "use-icon", "use-id", "visually-hidden"]
sidebar = ["scroll-area"]
splitter = ["use-drag", "use-id", "use-icon", "visually-hidden"]
transition = ["box", "use-timers"]

# Hooks (todo 3922): one feature per hook module, a hook's feature turns on the hooks it uses.
all-hooks = ["use-accessibility", "use-back", "use-clipboard", "use-color-scheme", "use-countdown", "use-debounce", "use-direction", "use-drag", "use-element", "use-focus-return", "use-fullscreen", "use-geolocation", "use-history", "use-hotkeys", "use-icon", "use-id", "use-indexed-db", "use-intersection", "use-long-press", "use-media", "use-media-query", "use-popover", "use-push-subscription", "use-share", "use-local-storage", "use-swipe", "use-system-notification", "use-timers", "use-user-media"]
use-accessibility = []
use-back = ["use-popover"]
use-clipboard = []
use-color-scheme = []
use-countdown = []
use-debounce = ["use-timers"]
use-direction = []
use-drag = ["use-element"]
use-element = []
use-focus-return = ["use-element"]
use-fullscreen = ["use-back"]
use-geolocation = []
use-history = ["use-timers"]
use-hotkeys = ["use-popover"]
use-icon = []
use-id = []
use-indexed-db = ["use-local-storage"]
use-intersection = ["use-element"]
use-long-press = ["use-timers"]
use-media = ["use-element"]
use-media-query = []
use-popover = ["use-focus-return"]
use-push-subscription = []
use-share = []
use-local-storage = []
use-swipe = ["use-direction", "use-drag"]
