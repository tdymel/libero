[package]
name = "libero"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
# TEMPORARY: local path dep against .dioxus-fork (tracks dioxus main, plus
# our own still-needed fixes - see .dioxus-fork/BUGS.md) instead of the
# crates.io 0.7.10 release, so this crate and the `dx` CLI building it are
# always built from identical source - avoids wire-protocol version-skew
# bugs between the two (see BUGS.md, "Building docs against main's dx").
# Unwind back to a crates.io version before any real release - a path dep
# blocks publishing to crates.io entirely, and .dioxus-fork isn't checked
# in, so nobody else can build this as-is.
dioxus = { path = "../.dioxus-fork/packages/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "router", "logger"] }
fast_qr = { version = "0.13.1", default-features = false, features = ["svg"] }

# Everything web-specific is wasm32-only, so a native build (`cargo test`, or
# any future non-web renderer) compiles without it and the platform-backed
# APIs return `PlatformError::Unsupported` instead of panicking inside
# wasm-bindgen. `Code`'s highlighter uses the browser's own `RegExp` engine
# via `js_sys` there; the `regex` crate below is its non-web counterpart,
# never compiled for wasm32 at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "NodeList", "Navigator", "Clipboard", "DomRect", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = "1"

[features]
default = [
    "wasm-split",
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
]
# `Code`'s syntax highlighting and `QrCode`'s encoding both pull in code
# that's only needed lazily - with this on, they're `#[wasm_split]` out into
# a chunk fetched on first use instead of the main bundle, which only pays
# off if the consumer's own build also passes `dx build`/`dx serve
# --wasm-split`. Turn this off (via `default-features = false`) to get a
# plain, un-split build that works with a normal `dx serve`/`dx build` -
# both components render identically either way, just from the main bundle
# instead of a lazy-loaded one.
wasm-split = ["dioxus/wasm-split"]
# `Box` (and anything built on it - `Title`, `Text`, `Icon`, ...) can render
# as any of the full HTML5 element set via `component: HtmlTag::...`/a tag
# name string, but `render_polymorphic` only compiles a match arm per tag
# that's actually reachable - without this, only the tags `libero`'s own
# components (and `docs`) use internally get a real arm (see
# `polymorphic.rs`'s `html_tags!` invocation); everything else silently
# renders as `<div>` instead of failing to compile. Turn this on if your own
# app passes a `full`-tier tag (e.g. `"table"`, `"nav"`, `"textarea"`) to
# `component`.
full-polymorphism = []
# Each turns on one hand-ported grammar in `components/typography/code/languages/`
# (see `language_catalog.rs`) - only the languages you enable are compiled in.
code-lang-bash = []
code-lang-c = []
code-lang-cpp = []
code-lang-csharp = []
code-lang-css = []
code-lang-dart = []
code-lang-go = []
code-lang-graphql = []
code-lang-haskell = []
code-lang-html = []
code-lang-java = []
code-lang-javascript = []
code-lang-json = []
code-lang-kotlin = []
code-lang-lua = []
code-lang-markdown = []
code-lang-objective-c = []
code-lang-perl = []
code-lang-php = []
code-lang-powershell = []
code-lang-python = []
code-lang-r = []
code-lang-ruby = []
code-lang-rust = []
code-lang-scala = []
code-lang-sql = []
code-lang-swift = []
code-lang-toml = []
code-lang-typescript = []
code-lang-yaml = []
