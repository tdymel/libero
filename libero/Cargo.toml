[package]
name = "libero"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dymel <tom@dymel.dev>"]
description = "A work in progress component library focused on DX, UX, a11y and configurability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/libero"
homepage = "https://github.com/tdymel/libero"
documentation = "https://docs.rs/libero"
readme = "README.md"
keywords = ["components", "ui", "design-system", "dioxus"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
# TEMPORARY: local path dep against `.dioxus-active`, a symlink `just
# mode-main` / `just mode-fork` points at `.dioxus-main` (upstream main) or
# `.dioxus-fork` (main + our still-needed fixes, see .dioxus-fork/BUGS.md)
# instead of the crates.io 0.7.10 release, so this crate and the `dx` CLI
# building it are always built from identical source - avoids wire-protocol
# version-skew bugs between the two. Fork mode also needs `--features
# dioxus-fork`; a mismatch is a compile error, not silent breakage.
# Unwind back to a crates.io version before any real release - a path dep
# blocks publishing to crates.io entirely, and neither tree is checked in,
# so nobody else can build this as-is.
dioxus = { path = "../.dioxus-active/packages/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "mounted", "router", "logger"] }
fast_qr = { version = "0.13.1", default-features = false, features = ["svg"] }
libero-macros = { path = "../libero-macros", version = "0.1.0" }

# Everything web-specific is wasm32-only, so a native build (`cargo test`, or
# any future non-web renderer) compiles without it and the platform-backed
# APIs return `PlatformError::Unsupported` instead of panicking inside
# wasm-bindgen. `Code`'s highlighter uses the browser's own `RegExp` engine
# via `js_sys` there; the `regex` crate below is its non-web counterpart,
# never compiled for wasm32 at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "HtmlElement", "HtmlFormElement", "HtmlInputElement", "DataTransfer", "DataTransferItem", "DataTransferItemList", "File", "FileList", "NodeList", "Navigator", "Clipboard", "DomRect", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = "1"
# Blitz's `NodeHandle`, which is what a `MountedData` downcasts to under
# dioxus-native - the whole `platform::ElementApi` is answerable from it, DOM
# queries included. Only pulled in by the `native` feature; without it a
# native build still measures and focuses through dioxus's own mounted API.
dioxus-native-dom = { path = "../.dioxus-active/packages/native-dom", optional = true }
# `NodeHandle` hands back a `BaseDocument`, which `dioxus-native-dom` does not
# re-export. The workspace's `[patch.crates-io]` points this at `.blitz-fork`,
# so it is the same crate dioxus-native itself uses.
blitz-dom = { version = "0.3.0-beta.2", optional = true, default-features = false }
blitz-traits = { version = "0.3.0-beta.2", optional = true }
# Our own clipboard handle rather than the shell's: `blitz-shell` builds an
# `arboard::Clipboard` per call and drops it, and arboard's X11 backend
# destroys the window that *owns* the selection on the last drop - so the
# copied text is gone before anything can paste it. Same version and feature
# set as blitz-shell's, so cargo keeps one copy.
arboard = { version = "3.6", optional = true, default-features = false }

# Render-to-string, for the component tests in `tests/` - the active tree's
# own copy, so the tests build against exactly the dioxus this crate does.
[dev-dependencies]
dioxus-ssr = { path = "../.dioxus-active/packages/ssr" }

[features]
# Build against `.dioxus-fork` instead of upstream main. Only the fork lets a
# component declare `children: Vec<Element>`, which is what splits a caller's
# children into individually wrappable nodes - see `common::Children`. Set by
# `just mode-fork`; wrong mode is a compile error.
dioxus-fork = []
# Reach elements through Blitz directly when running under `dioxus-native`.
# Nothing forces it on: without it `platform::backend` falls back to dioxus's
# portable mounted handle, which cannot query a subtree or report focus.
native = ["dep:dioxus-native-dom", "dep:blitz-dom", "dep:blitz-traits", "dep:arboard"]
default = [
    "code-lang-rust",
    "code-lang-bash",
    "code-lang-markdown",
    "code-lang-html",
    "code-lang-css",
]
# `Box` (and anything built on it - `Title`, `Text`, `Icon`, ...) can render
# as any of the full HTML5 element set via `component: HtmlTag::...`/a tag
# name string, but `render_polymorphic` only compiles a match arm per tag
# that's actually reachable - without this, only the tags `libero`'s own
# components (and `docs`) use internally get a real arm (see
# `polymorphic.rs`'s `html_tags!` invocation); everything else silently
# renders as `<div>` instead of failing to compile. Turn this on if your own
# app passes a `full`-tier tag (e.g. `"table"`, `"nav"`, `"textarea"`) to
# `component`.
full-polymorphism = []
# Each turns on one hand-ported grammar in `components/typography/code/languages/`
# (see `language_catalog.rs`) - only the languages you enable are compiled in.
code-lang-bash = []
code-lang-c = []
code-lang-cpp = []
code-lang-csharp = []
code-lang-css = []
code-lang-dart = []
code-lang-go = []
code-lang-graphql = []
code-lang-haskell = []
code-lang-html = []
code-lang-java = []
code-lang-javascript = []
code-lang-json = []
code-lang-kotlin = []
code-lang-lua = []
code-lang-markdown = []
code-lang-objective-c = []
code-lang-perl = []
code-lang-php = []
code-lang-powershell = []
code-lang-python = []
code-lang-r = []
code-lang-ruby = []
code-lang-rust = []
code-lang-scala = []
code-lang-sql = []
code-lang-swift = []
code-lang-toml = []
code-lang-typescript = []
code-lang-yaml = []
