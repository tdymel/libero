[package]
name = "native-tests"
version = "0.1.0"
edition = "2024"
# Never published. Mounts libero components in a windowless Blitz document and
# drives them with Blitz's own event pipeline: see
# `.agents/brain/codebase/testing/native-harness.md`. Its own crate, so the
# `libero/native` feature and Blitz's style engine stay out of every web build;
# excluded from the merge gate's workspace clippy for the same reason as `e2e`,
# and run by the gate's `native` tier instead.
publish = false

[dependencies]
dioxus = { path = "../.dioxus-active/packages/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "mounted", "router", "logger"] }
libero = { path = "../libero", default-features = false, features = ["native"] }
# The windowless half of dioxus-native: no winit, no renderer. The workspace
# `[patch.crates-io]` points the `blitz-*` crates at `.blitz-fork`, so this is
# the same Blitz the native docs run.
dioxus-native-dom = { path = "../.dioxus-active/packages/native-dom" }
blitz-dom = { version = "0.3.0-beta.2", default-features = false }
# Only for `HtmlProvider`: without it every `<style dangerous_inner_html>`
# arrives empty and libero renders unstyled.
blitz-html = { version = "0.3.0-beta.2", default-features = false }
blitz-traits = "0.3.0-beta.2"
# What Blitz paints, not what stylo computed: `Page::painted_*` records the
# scene the shell would draw.
blitz-paint = { version = "0.3.0-beta.2", default-features = false }
anyrender = "0.13"
kurbo = "0.13"
peniko = "0.6"
