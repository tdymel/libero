[package]
name = "native-tests"
version = "0.1.0"
edition = "2024"
# Never published. Mounts libero components in a windowless Blitz document and
# drives them with Blitz's own event pipeline: see
# `.agents/brain/codebase/testing/native-harness.md`. Its own crate, so the
# `libero/native` feature and Blitz's style engine stay out of every web build;
# excluded from the merge gate's workspace clippy for the same reason as `e2e`,
# and run by the gate's `native` tier instead.
publish = false

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "mounted", "router", "logger"] }
libero = { path = "../libero", default-features = false, features = ["native"] }
# The windowless half of dioxus-native: no winit, no renderer. The `blitz-*`
# versions match dioxus-native's, so this is the same Blitz the native docs run.
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus" }
blitz-dom = { version = "0.3.0-beta.2", default-features = false }
# Only for `HtmlProvider`: without it every `<style dangerous_inner_html>`
# arrives empty and libero renders unstyled.
blitz-html = { version = "0.3.0-beta.2", default-features = false }
blitz-traits = "0.3.0-beta.2"
# `Page::computed`: stylo's resolved values. The version blitz-dom uses.
style = { package = "stylo", version = "0.20" }
# What Blitz paints, not what stylo computed: `Page::painted_*` records the
# scene the shell would draw; `svg` rasterises inline svgs too (todo 882).
blitz-paint = { version = "0.3.0-beta.2", default-features = false, features = ["svg"] }
anyrender = "0.13"
# `Page::painted_pixel` rasterises that scene with the shell's CPU renderer.
anyrender_vello_cpu = { version = "0.17", default-features = false }
kurbo = "0.13"
peniko = "0.6"
# `Page` fails a test on a `dioxus_signals` warning.
tracing = "0.1"
