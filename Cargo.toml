[workspace]
members = ["libero", "libero-macros", "docs", "e2e", "e2e/fixtures"]
exclude = [".dioxus-fork", ".dioxus-main", ".dioxus-active", ".blitz-fork"]
resolver = "3"

# Blitz's `resolve_transforms` never refreshes the cached transform a node is
# painted with unless that node also has RECALCULATE_OVERFLOW damage, so a
# transform that changes without moving anything (Switch's thumb, Slider's
# thumb, Tree's chevron, Table's sort arrow) keeps painting its old value. Not
# yet fixed upstream - see writeups/blitz-stale-painted-transform.md.
[patch.crates-io]
blitz-dom = { path = ".blitz-fork/packages/blitz-dom" }
blitz-html = { path = ".blitz-fork/packages/blitz-html" }
blitz-net = { path = ".blitz-fork/packages/blitz-net" }
blitz-paint = { path = ".blitz-fork/packages/blitz-paint" }
blitz-shell = { path = ".blitz-fork/packages/blitz-shell" }
blitz-traits = { path = ".blitz-fork/packages/blitz-traits" }
stylo_taffy = { path = ".blitz-fork/packages/stylo_taffy" }

# Full debug info is most of what a dev build writes, and on this encrypted
# disk that write load is what stalls parallel builds. Line tables keep
# backtraces readable. Set here, not per command, so the editor, `dx serve`
# and every agent build the same way. `unpacked` keeps the debug info out of
# the linked binaries on Linux; cargo skips it for wasm, which rejects it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# `dx`'s web dev profile. Nothing here reads wasm debug info, and the
# `wasm-dev` dir had grown to 50 GB. The name section survives, so a panic in
# the browser console still names its functions. To chase a browser error
# with file and line, set `CARGO_PROFILE_WASM_DEV_DEBUG=line-tables-only` on
# that one `dx` command instead of editing this.
[profile.wasm-dev]
inherits = "dev"
debug = false

# Blitz's stack (stylo, taffy, vello, wgpu) is unusably slow when compiled
# without optimisations, and a debug `just start-native` spends nearly all its
# time in it. Optimising only non-workspace crates keeps `libero`/`docs`
# themselves unoptimised, so a debug build still debugs and still rebuilds at
# debug speed - the price is one full rebuild of the dependency graph.
[profile.dev.package."*"]
opt-level = 3

# `release` is tuned for wasm bundle size ("z" + fat LTO), which is the wrong
# trade for a native window. Native release builds use this instead.
[profile.native]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
